services:
  auth_service:
    build: ./auth_service
    expose:
      - "8080"
  
  event_service:
    build: ./event_service
    expose:
      - "8081"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - auth_service
      - event_service

volumes:
  mongo-data:

  